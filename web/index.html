<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulse Monitor v{{VERSION}}</title>
<style>
  /* =================== Thèmes =================== */
  :root, [data-theme="dark"], [data-theme="oled"], [data-theme="midnight"], [data-theme="terminal"] { color-scheme: dark; }
  :root, [data-theme="dark"] {
    --bg: #0d0f14; --panel: #151922; --panel2: #1b2030; --line: #262c3b; --hdr: #0d0f14f0;
    --text: #e8ebf2; --muted: #8b93a7; --dim: #5d6478; --chart: #11151d; --grid: #ffffff0d; --track: #232938;
    --cpu: #4cc2ff; --ram: #b38cff; --gpu: #ffa94d; --disk: #5fd38d; --net: #ff6b9d; --up: #ffd36b;
    --ok: #5fd38d; --warn: #ffb547; --bad: #ff5d6c; --tip1: #1a2233; --tip2: #161b26; --tipline: #263048;
  }
  [data-theme="light"] { color-scheme: light;
    --bg: #f3f5f9; --panel: #ffffff; --panel2: #eceff5; --line: #dde2ea; --hdr: #f3f5f9f0;
    --text: #18202e; --muted: #5a6476; --dim: #8c94a5; --chart: #f6f8fb; --grid: #0000000f; --track: #e3e7ee;
    --cpu: #0a84d6; --ram: #7c4ddb; --gpu: #e07b00; --disk: #1f9d55; --net: #d6336c; --up: #b98900;
    --ok: #1f9d55; --warn: #c97a00; --bad: #d93043; --tip1: #eef4ff; --tip2: #f6f8fc; --tipline: #dfe6f3;
  }
  [data-theme="oled"] {
    --bg: #000000; --panel: #0a0a0b; --panel2: #161618; --line: #1d1d20; --hdr: #000000f0;
    --text: #f2f2f2; --muted: #8f8f96; --dim: #5a5a62; --chart: #050506; --grid: #ffffff0b; --track: #1b1b1f;
    --cpu: #4cc2ff; --ram: #b38cff; --gpu: #ffa94d; --disk: #5fd38d; --net: #ff6b9d; --up: #ffd36b;
    --ok: #5fd38d; --warn: #ffb547; --bad: #ff5d6c; --tip1: #0d0f14; --tip2: #08090b; --tipline: #1d1f26;
  }
  [data-theme="midnight"] {
    --bg: #0a1022; --panel: #111a33; --panel2: #18234a; --line: #223062; --hdr: #0a1022f0;
    --text: #e6ecff; --muted: #8e9bc4; --dim: #5d6a96; --chart: #0c1430; --grid: #ffffff0e; --track: #1d2a56;
    --cpu: #5ad1ff; --ram: #c49bff; --gpu: #ffb86b; --disk: #6ee7a8; --net: #ff7ab2; --up: #ffe08a;
    --ok: #6ee7a8; --warn: #ffc15e; --bad: #ff6b81; --tip1: #16224a; --tip2: #111a38; --tipline: #24336a;
  }
  [data-theme="terminal"] {
    --bg: #050a06; --panel: #0a130c; --panel2: #102014; --line: #173320; --hdr: #050a06f0;
    --text: #c8ffd9; --muted: #6fbf88; --dim: #3f7a52; --chart: #061008; --grid: #33ff990f; --track: #12301b;
    --cpu: #33ff99; --ram: #7dffb8; --gpu: #c6ff5c; --disk: #2ee6c3; --net: #9dff6b; --up: #e6ff8a;
    --ok: #33ff99; --warn: #e6ff5c; --bad: #ff6b6b; --tip1: #0c1d10; --tip2: #08140b; --tipline: #173320;
  }
  [data-theme="terminal"] body { font-family: Consolas, "Cascadia Mono", monospace; }

  * { box-sizing: border-box; }
  html { scrollbar-gutter: stable; }   /* la barre de défilement ne décale plus le contenu */
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.45 "Segoe UI Variable", "Segoe UI", system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 10px 22px; background: var(--hdr); border-bottom: 1px solid var(--line); }
  .logo { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 16px; }
  .ver { font-size: 11px; font-weight: 600; color: var(--muted); background: var(--panel); border: 1px solid var(--line); padding: 1px 6px; border-radius: 6px; }
  .seg { display: flex; gap: 3px; background: var(--panel); padding: 3px; border-radius: 9px; }
  .seg button { border: 0; background: none; color: var(--muted); font: inherit; font-weight: 600; padding: 5px 13px; border-radius: 7px; cursor: pointer; }
  .seg button.on { background: var(--panel2); color: var(--text); }
  /* onglets du haut : un cadre sobre glisse jusqu'à l'onglet ouvert */
  #tabs { position: relative; }
  #tabs button { position: relative; z-index: 1; padding: 5px 11px; }
  #tabs button.on { background: none; }
  #tab-ind { position: absolute; top: 3px; height: calc(100% - 6px); left: 0; width: 0; border-radius: 7px; background: var(--panel2);
    border: 1px solid color-mix(in srgb, var(--cpu) 45%, var(--line)); box-shadow: 0 0 6px color-mix(in srgb, var(--cpu) 25%, transparent);
    transition: left .28s cubic-bezier(.4, .1, .2, 1), width .28s cubic-bezier(.4, .1, .2, 1); pointer-events: none; box-sizing: border-box; }
  /* onglet Gaming : néon (bordure dégradée + halo) qui apparaît en fondu, et reflet qui passe, seulement au survol */
  #tabs button.neon { overflow: hidden; transition: color .3s, text-shadow .3s, box-shadow .3s; border-radius: 7px; }
  #tabs button.neon::before { content: ""; position: absolute; inset: 0; border-radius: 7px; padding: 1.5px; pointer-events: none;
    background: linear-gradient(90deg, #3ee8ff, #8a5cff, #ff4fd8);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude;
    opacity: 0; transition: opacity .3s; }
  #tabs button.neon:hover { color: #fff; text-shadow: 0 0 6px #ffffffaa; box-shadow: 0 0 10px #3ee8ff99, 0 0 20px #ff4fd866; }
  #tabs button.neon:hover::before { opacity: 1; }
  #tabs button.neon::after { content: ""; position: absolute; top: -20%; bottom: -20%; width: 40%; left: -60%; pointer-events: none;
    background: linear-gradient(100deg, transparent, #ffffff55, transparent); transform: skewX(-20deg); opacity: 0; transition: opacity .3s; }
  #tabs button.neon:hover::after { opacity: 1; animation: sweep 1.3s ease-in-out infinite; }
  @keyframes sweep { from { left: -60%; } to { left: 130%; } }
  .seg.small button { padding: 4px 10px; font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px; }
  .hdr-right { margin-left: auto; color: var(--muted); font-size: 13px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .hdr-right b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .chip { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; position: relative; cursor: default; }
  .pop { position: absolute; top: calc(100% + 8px); right: 0; z-index: 20; min-width: 250px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 11px; padding: 12px 14px; box-shadow: 0 10px 30px #0006; color: var(--text);
    display: none; text-align: left; cursor: default; }
  .pop.on { display: block; }
  .pop h4 { margin: 0 0 8px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }
  .pop table td, .pop table th { padding: 4px 10px 4px 0; border-top: 1px solid var(--line); white-space: nowrap; }
  .pop table th { border: 0; }
  .pop .note { font-size: 12px; color: var(--dim); margin-top: 8px; white-space: normal; }
  main { padding: 14px 22px 30px; max-width: 1600px; margin: 0 auto; }
  .tab { display: none; } .tab.on { display: block; }

  /* =================== Sections & cartes =================== */
  .section { margin-bottom: 12px; }
  .section-title { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); text-transform: uppercase;
    letter-spacing: .8px; margin: 0 0 8px; font-weight: 600; cursor: pointer; user-select: none; width: fit-content; }
  .section-title:hover { color: var(--text); }
  .section-title .count { text-transform: none; letter-spacing: 0; color: var(--dim); font-weight: 400; }
  .section.collapsed > .grid { display: none; }
  .chev { width: 15px; height: 15px; flex: none; transition: transform .2s; opacity: .7; }
  .section.collapsed > .section-title .chev, .card.collapsed > .c-head .chev { transform: rotate(-90deg); }
  .grip { cursor: grab; color: var(--dim); opacity: 0; transition: opacity .15s; font-size: 13px; letter-spacing: -2px; width: 10px; margin-left: -8px; flex: none; user-select: none; }
  .c-head.nofold { cursor: default; }
  .card:not(.spec) > .c-head { cursor: default; } .card:not(.spec) > .c-head:has(.detbtn) { cursor: pointer; }
  .card:not(.spec) > .c-head:has(.detbtn):hover .c-title { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: color-mix(in srgb, currentColor 40%, transparent); }
  .c-head:hover .grip, .section-title:hover .grip { opacity: 1; }
  .c-head.nofold { cursor: default; }
  .dragging { opacity: .35; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 10px; align-items: start; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px 12px 16px;
    display: flex; flex-direction: column; gap: 7px; min-width: 0; }
  .c-head { display: flex; align-items: center; gap: 8px; min-width: 0; cursor: pointer; user-select: none; min-height: 26px; }
  .dot { width: 9px; height: 9px; border-radius: 3px; flex: none; }
  .c-title { font-weight: 700; font-size: 14px; white-space: nowrap; }
  .c-sub { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
  .big { font-size: 21px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; white-space: nowrap; }
  .big small { font-size: 12px; font-weight: 600; color: var(--muted); margin-left: 2px; }
  .state { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 99px; background: var(--panel2); white-space: nowrap; }
  .chartwrap { position: relative; }
  .over { position: absolute; left: 8px; top: 6px; display: flex; align-items: center; gap: 8px; pointer-events: none; }
  .over .big { text-shadow: 0 0 6px var(--chart), 0 0 2px var(--chart); }
  canvas.chart { width: 100%; height: 62px; display: block; border-radius: 7px; background: var(--chart); }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 3px 12px; }
  .stat { min-width: 0; }
  .stat .k { color: var(--dim); font-size: 10.5px; text-transform: uppercase; letter-spacing: .4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat .v { font-weight: 600; font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar { height: 6px; background: var(--track); border-radius: 99px; overflow: hidden; }
  .bar > i { display: block; height: 100%; border-radius: 99px; }
  .vol { display: grid; grid-template-columns: 26px 1fr auto; gap: 8px; align-items: center; font-size: 12px; }
  .vol .t { color: var(--muted); font-variant-numeric: tabular-nums; }
  .cores { display: grid; grid-template-columns: repeat(auto-fill, minmax(11px, 1fr)); gap: 2px; }
  .core { height: 14px; background: var(--track); border-radius: 3px; position: relative; overflow: hidden; }
  .core > i { position: absolute; left: 0; right: 0; bottom: 0; background: var(--cpu); opacity: .85; }
  .legend { display: flex; gap: 12px; font-size: 11.5px; color: var(--muted); }
  .legend span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; background: var(--c); }

  /* Carte repliée : même largeur, juste moins haute (infos clés + mini-graphique) */
  .crow, .hval { display: none; }
  /* carte étirée : c'est le graphique qui prend la place en plus */
  #perf .card:not(.collapsed) .chartwrap { flex: 1 1 auto; min-height: 62px; }
  #perf .card:not(.collapsed) .chartwrap canvas.chart { position: absolute; inset: 0; width: 100%; height: 100%; }
  #perf.bigmode .card:not(.collapsed) .chartwrap { min-height: 150px; }
  .card.collapsed .crow { height: 34px; }
  #perf.bigmode .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  @media (max-width: 1000px) { #perf.bigmode .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  #perf.bigmode canvas.chart { height: 150px; }
  #perf.bigmode .over .big { font-size: 28px; }
  .hid { display: none !important; }
  .bell { position: relative; background: var(--panel); border: 1px solid var(--line); color: var(--muted); border-radius: 8px;
    width: 34px; height: 30px; display: grid; place-items: center; cursor: pointer; padding: 0; font: inherit; }
  .bell:hover, .bell.on { color: var(--text); background: var(--panel2); }
  .bdot { position: absolute; top: 4px; right: 5px; width: 8px; height: 8px; border-radius: 50%; background: var(--bad); display: none;
    box-shadow: 0 0 0 2px var(--panel); }
  .bdot.on { display: block; }
  .bdot.pulse { animation: bpulse 2s ease-in-out infinite; }
  .bdot.info { background: var(--warn); }
  @keyframes bpulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.75); } }
  .bellpop { width: 430px; max-width: 92vw; padding: 14px 16px; cursor: default; }
  .bellpop h4 { margin: 2px 0 8px; }
  .alx { border: 0; background: none; color: var(--dim); cursor: pointer; width: 22px; height: 22px; border-radius: 5px; padding: 0; font-size: 12px; align-self: start; }
  .alx:hover { background: var(--panel2); color: var(--text); }
  .al { display: grid; grid-template-columns: 82px 1fr 22px; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 13px; line-height: 1.45; }
  .al:first-of-type { border-top: 0; }
  .allgood { color: var(--ok); font-weight: 600; padding: 4px 0 8px; }
  .shares { display: grid; grid-template-columns: 74px 1fr 42px; gap: 6px 10px; align-items: center; font-size: 12.5px; margin: 8px 0; }
  .verdict { font-weight: 600; font-size: 13px; margin: 6px 0 4px; }
  .linkbtn { background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; font: inherit; font-size: 12px; padding: 0; }
  .detbtn { border: 0; background: none; color: var(--dim); width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center;
    cursor: pointer; flex: none; padding: 0; font: inherit; }
  .detbtn:hover, .detbtn.on { background: var(--panel2); color: var(--text); }
  .drawer { position: fixed; right: 0; bottom: 0; top: 57px; width: 440px; max-width: 94vw; z-index: 15; background: var(--panel);
    border-left: 1px solid var(--line); box-shadow: -12px 0 30px #0005; transform: translateX(105%); transition: transform .22s ease;
    display: flex; flex-direction: column; }
  .drawer.on { transform: none; }
  .dimmer { position: fixed; left: 0; right: 0; bottom: 0; top: 57px; z-index: 14; background: #000; opacity: 0; pointer-events: none; transition: opacity .22s ease; }
  .dimmer.on { opacity: .38; pointer-events: auto; }
  [data-theme="light"] .dimmer.on { opacity: .22; }
  .d-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px 6px; }
  .d-title { font-weight: 700; font-size: 15px; }
  .d-sub { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .d-note { color: var(--dim); font-size: 12px; padding: 0 16px 10px; border-bottom: 1px solid var(--line); }
  .d-list { flex: 1; overflow-y: auto; padding: 6px 10px; }
  .d-row { display: grid; grid-template-columns: minmax(0, 1fr) 90px auto; gap: 10px; align-items: center; padding: 7px 6px; border-radius: 7px; }
  .d-row:hover { background: var(--panel2); }
  .d-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
  .d-name small { color: var(--dim); font-weight: 400; margin-left: 4px; }
  .d-val { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 600; }
  .d-val small { display: block; color: var(--muted); font-weight: 400; font-size: 11.5px; }
  .d-foot { color: var(--dim); font-size: 12px; padding: 8px 16px; border-top: 1px solid var(--line); }
  .tipbox { position: fixed; z-index: 60; max-width: 290px; background: var(--panel2); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 9px; font-size: 12.5px; line-height: 1.4; box-shadow: 0 6px 20px #0005; pointer-events: none;
    opacity: 0; transition: opacity .12s; text-transform: none; letter-spacing: 0; font-weight: 400; }
  .tipbox.on { opacity: 1; }
  .card.collapsed > :not(.c-head):not(.crow) { display: none; }
  .card.collapsed { gap: 4px; padding-bottom: 9px; }
  .card.collapsed .crow { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .card.collapsed .hval { display: inline; font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .card.collapsed .c-sub { visibility: hidden; }
  .mini { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 0 12px; max-height: 36px; overflow: hidden; font-size: 12px; color: var(--muted); }
  .mini span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .mini b { color: var(--text); font-variant-numeric: tabular-nums; margin-left: 4px; }
  canvas.spark { width: 96px; height: 26px; flex: none; border-radius: 5px; background: var(--chart); }

  /* =================== Composants =================== */
  .tips { background: linear-gradient(135deg, var(--tip1), var(--tip2)); margin-bottom: 12px; }
  .tips .lead { margin: -2px 0 0; color: var(--muted); font-size: 12.5px; }
  .tip { display: grid; grid-template-columns: 92px 1fr; gap: 12px; padding: 7px 0; border-top: 1px solid var(--tipline); }
  .tag { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; text-align: center; align-self: start; }
  .tag.info { background: color-mix(in srgb, var(--cpu) 14%, transparent); color: var(--cpu); }
  .tag.warn { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
  .specs { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 12px; align-items: stretch; }
  .specs > .w3 { grid-column: span 3; } .specs > .w4 { grid-column: span 4; } .specs > .w6 { grid-column: span 6; }
  .specs > .tall { grid-row: span 2; }   /* « Infos à compléter » à droite de Système + Réseau */
  .specs > .card.collapsed { align-self: start; }
  @media (max-width: 1150px) { .specs > .w3, .specs > .w4 { grid-column: span 6; } }
  @media (max-width: 760px) { .specs > .card { grid-column: span 12 !important; } }
  .specs .mgrid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .specs .mgroup { padding: 9px 10px; }
  @media (max-width: 1500px) { .specs .mgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .specs .fld { grid-template-columns: 1fr; gap: 3px; }
  .spec .name { font-size: 15.5px; font-weight: 600; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 5px 18px; margin: 0; }
  dt { color: var(--muted); } dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--dim); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .4px; padding: 3px 8px 5px 0; }
  td { padding: 5px 8px 5px 0; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  td.empty { color: var(--dim); font-style: italic; }
  .pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 5px; background: var(--panel2); }
  .toolbar { display: flex; margin-bottom: 10px; gap: 8px; align-items: center; flex-wrap: wrap; }
  .btn { border: 1px solid var(--line); background: var(--panel); color: var(--text); font: inherit; font-weight: 600; font-size: 13px;
    padding: 6px 12px; border-radius: 8px; cursor: pointer; }
  .btn:hover { background: var(--panel2); }
  .btn.sm { padding: 3px 9px; font-size: 12px; }
  .muted { color: var(--muted); }
  .loading { padding: 50px; text-align: center; color: var(--muted); }
  .spinner { width: 24px; height: 24px; border: 3px solid var(--line); border-top-color: var(--cpu); border-radius: 50%; margin: 0 auto 12px; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .mgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .mgroup { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 7px; align-content: start; }
  .mgroup h5 { margin: 0 0 2px; font-size: 13px; }
  .fld { display: grid; grid-template-columns: 120px 1fr; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
  .fld input, .fld select { width: 100%; min-width: 0; background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 7px; padding: 5px 8px; font: inherit; font-size: 13px; }
  .fld input:focus, .fld select:focus { outline: 2px solid color-mix(in srgb, var(--cpu) 50%, transparent); border-color: transparent; }

  /* =================== Stockage =================== */
  .st-wrap { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 12px; align-items: start; }
  .st-drives { display: grid; gap: 12px; position: sticky; top: 0; }
  .st-drive { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; cursor: pointer; text-align: left;
    font: inherit; color: var(--text); display: grid; gap: 4px; }
  .st-drive:hover { background: var(--panel2); }

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let COL = {};
function readColors() {
  const cs = getComputedStyle(document.documentElement);
  for (const k of ["cpu", "ram", "gpu", "disk", "net", "up", "grid", "chart"]) COL[k] = cs.getPropertyValue("--" + k).trim();

// =================== Historique & graphiques ===================
const HIST = 60, hist = {};
let noPush = false;
function push(key, v) {
  const a = hist[key] || (hist[key] = new Array(HIST).fill(null));
  if (noPush) return a;
  a.push(v); if (a.length > HIST) a.shift();
  return a;
}
function draw(canvas, series, max, small) {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (!w || !h) return;   // replié ou onglet caché : rien à dessiner
  const dpr = window.devicePixelRatio || 1;
  if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
  }
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  if (!small) {
    ctx.strokeStyle = COL.grid; ctx.lineWidth = 1; ctx.beginPath();
    for (let i = 1; i < 3; i++) { const y = Math.round(h * i / 3) + .5; ctx.moveTo(0, y); ctx.lineTo(w, y); }
    for (let i = 1; i < 6; i++) { const x = Math.round(w * i / 6) + .5; ctx.moveTo(x, 0); ctx.lineTo(x, h); }
    ctx.stroke();
  }
  const step = w / (HIST - 1);
  for (const s of series) {
    const pts = [];
    s.data.forEach((v, i) => { if (v != null) pts.push([i * step, h - 2 - Math.min(1, v / max) * (h - 5)]); });
    if (pts.length < 2) continue;
    if (!s.noFill) {
      const g = ctx.createLinearGradient(0, 0, 0, h);
      g.addColorStop(0, s.color + "55"); g.addColorStop(1, s.color + "05");
      ctx.beginPath(); ctx.moveTo(pts[0][0], h);
      pts.forEach(p => ctx.lineTo(p[0], p[1]));
      ctx.lineTo(pts[pts.length - 1][0], h); ctx.closePath(); ctx.fillStyle = g; ctx.fill();
    }
    ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
    ctx.strokeStyle = s.color; ctx.lineWidth = small ? 1.4 : 1.6; ctx.lineJoin = "round"; ctx.stroke();
  }
}

let defSeq = 0;
function applyOrder(container) {
  const key = container.id || container.dataset.okey;
  const list = order[key] || [];
  const kids = [...container.children].filter(n => n.dataset.id);
  const rank = n => { const i = list.indexOf(n.dataset.id); return i < 0 ? 1000 + (+n.dataset.def || 0) : i; };
  const sorted = [...kids].sort((a, b) => rank(a) - rank(b));
  if (sorted.some((n, i) => n !== kids[i])) sorted.forEach(n => container.appendChild(n));
}
function saveOrder(container) {
  order[container.id || container.dataset.okey] = [...container.children].filter(n => n.dataset.id).map(n => n.dataset.id);
  saveSettings();
}
let dragEl = null;

  const g = e.target.closest && e.target.closest(".grip");
  if (!g) return;
  dragEl = g.closest(".card, .section");
  dragEl.classList.add("dragging");
  e.dataTransfer.effectAllowed = "move";
  e.dataTransfer.setData("text/plain", dragEl.dataset.id);
  try { e.dataTransfer.setDragImage(dragEl, 20, 14); } catch (_) {}
});
document.addEventListener("dragover", e => {
  if (!dragEl) return;
  const cont = dragEl.parentNode;
  let t = e.target.closest && e.target.closest(".card, .section");
  while (t && t.parentNode !== cont) t = t.parentNode && t.parentNode.closest ? t.parentNode.closest(".card, .section") : null;
  e.preventDefault();
  if (!t || t === dragEl) return;
  const r = t.getBoundingClientRect();
  const sameRow = e.clientY >= r.top && e.clientY <= r.bottom && dragEl.classList.contains("card") && r.width < cont.clientWidth * .9;
  const after = sameRow ? e.clientX > r.left + r.width / 2 : e.clientY > r.top + r.height / 2;
  cont.insertBefore(dragEl, after ? t.nextSibling : t);
});
document.addEventListener("dragend", () => {
  if (!dragEl) return;
  dragEl.classList.remove("dragging");
  saveOrder(dragEl.parentNode);

});

function card(id, parent, {title, color, body, tip, det}) {
  if (cards[id]) return cards[id];
  const el = document.createElement("div");
  el.className = "card" + (collapsed.has(id) ? " collapsed" : "") + (hidden[id] ? " hid" : "");
  el.dataset.id = id; el.dataset.def = defSeq++;
  el.innerHTML = `<div class="c-head"${tipAttr("head")}><span class="grip" draggable="true" data-tip="${esc(T("drag"))}">⋮⋮</span>
      <span class="dot" style="background:${color}"></span>
      <span class="c-title" data-r="title">${esc(title)}</span><span class="c-sub" data-r="sub"></span>
      <span class="hval" data-r="hval"${tipAttr(tip)}></span>${det ? `<button class="detbtn" data-det="${det}" data-tip="${esc(T("details"))}">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></button>` : ""}</div>
    <div class="crow"><span class="mini" data-r="mini"></span><canvas class="spark" data-r="spark"${tipAttr(tip)}></canvas></div>
    <div class="chartwrap"${tipAttr(tip)}><canvas class="chart" data-r="chart"></canvas>
      <div class="over"><span class="big" data-r="big">–</span><span class="state" data-r="state"></span></div></div>${body || ""}`;
  parent.appendChild(el);
  applyOrder(parent);
  const refs = {el, id};
  el.querySelectorAll("[data-r]").forEach(n => refs[n.dataset.r] = n);

const isCollapsed = c => c.el.classList.contains("collapsed");

// dessine le grand graphique ou le mini-graphique selon l'état ; renvoie true si la carte est dépliée

function equalize(d) {
  if (!tabOn()) return;
  const all = [...perfTab.querySelectorAll(".card[data-id]:not(.hid)")];
  const sig = [innerWidth, perfTab.classList.contains("bigmode"), lang, !!specs, all.map(n => n.dataset.id + (n.classList.contains("collapsed") ? "c" : "")).join(),
    d.disks.map(x => x.volumes.length).join(), [...perfTab.querySelectorAll(".section.collapsed")].length].join("|");
  if (sig === eqSig) return;
  eqSig = sig;
  const open = all.filter(n => !n.classList.contains("collapsed"));
  open.forEach(n => n.style.minHeight = "");
  const h = Math.max(0, ...open.map(n => n.offsetHeight));
  open.forEach(n => n.style.minHeight = h + "px");

  all.filter(n => n.classList.contains("collapsed")).forEach(n => n.style.minHeight = "");
}

  `<div class="card spec ${cls}" data-id="${id}" data-def="${defSeq++}"><div class="c-head nofold"><span class="grip" draggable="true" data-tip="${esc(T("drag"))}">⋮⋮</span><span class="dot" style="background:${color}"></span>
   <span class="c-title">${esc(title)}</span><span class="c-sub"></span></div>${inner}</div>`;
const sizeTxt = gb => gb ? (gb >= 1000 ? dec(gb / 1000, 1) + " " + T("units")[4] : gb + " " + T("units")[3]) : "?";

function renderSpecs() {
  const el = document.getElementById("comp-body"), s = specs;
  if (!s) { el.innerHTML = `<div class="loading"><div class="spinner"></div>${esc(T("loading"))}</div>`; return; }
  if (s.error) { el.innerHTML = `<div class="loading">${esc(T("spec_err"))}</div>`; return; }
  const ram = s.ram, cpu = s.cpu, b = s.board, os = s.os, GBu = " " + T("units")[3];

  const ramRows = (ram.modules || []).map(m => `<tr><td>${esc(m.slot)}</td><td>${dec(m.size_gb, m.size_gb % 1 ? 1 : 0)}${GBu}</td>
      <td>${m.configured || "?"}${m.speed && m.speed !== m.configured ? ` <span class="muted">(${T("max")} ${m.speed})</span>` : ""}</td>
      <td>${esc(m.maker)}</td><td>${esc(m.part)}</td></tr>`);
  if (ram.slots && ram.slots_used != null)
    for (let i = ram.slots_used; i < ram.slots; i++) ramRows.push(`<tr><td colspan="5" class="empty">${esc(T("slot_free"))}</td></tr>`);
  const ng = (s.gpus || []).length;
  const r1 = ng <= 1 ? "w4" : "w3";          // ligne 1 : processeur · carte(s) graphique(s) · carte mère
  const gspan = ng <= 2 ? r1 : "w3";
  const gpus = (s.gpus || []).map((g, i) => specCard("spec-gpu-" + i, "var(--gpu)", T(g.integrated ? "gpu_int" : "gpu"),
    `<div class="name">${esc(g.name)}</div>
     <dl>${row("vram", g.vram_gb ? dec(g.vram_gb, g.vram_gb % 1 ? 1 : 0) + GBu : null)}
         ${row("driver", g.driver)}${row("driver_date", g.driver_date)}
         ${row("display", g.res ? g.res + (g.hz ? " @ " + g.hz + " Hz" : "") : null)}</dl>`, gspan)).join("");
  const disks = (s.disks || []).map(d => `<tr><td>${esc(d.id)}</td><td>${esc((d.letters || []).map(letterTxt).join(" "))}</td>
      <td>${esc(d.name)}</td><td><span class="pill">${esc(d.media)}</span> ${esc(d.bus !== "?" ? d.bus : "")}</td>
      <td>${sizeTxt(d.size_gb)}</td><td>${d.health == null ? "" : esc(T("health" + d.health))}</td></tr>`).join("");

  const ids = ["spec-cpu", ...(s.gpus || []).map((_, i) => "spec-gpu-" + i), "spec-board",
               "spec-ram", "spec-disks", "spec-os", "spec-manual", "spec-net"];
  el.innerHTML = `
    <div class="toolbar" style="margin:-4px 0 6px">
      <span class="muted">${esc(T("copy_hint"))}</span><button class="btn sm" id="copy">${esc(T("copy_btn"))}</button></div>
    <div class="specs" data-okey="specs">
      ${specCard("spec-cpu", "var(--cpu)", T("cpu"), `<div class="name">${esc(cpu.name)}</div>
        <dl>${row("ct", `${cpu.cores ?? "?"} / ${cpu.threads ?? "?"}`)}
            ${row("base_freq", cpu.base_mhz ? dec(cpu.base_mhz / 1000, 2) + " GHz" : null)}
            ${row("socket", cpu.socket)}
            ${row("cache", cpu.l2_kb || cpu.l3_kb ? `${cpu.l2_kb ? Math.round(cpu.l2_kb / 1024) + " " + T("units")[2] : "?"} / ${cpu.l3_kb ? Math.round(cpu.l3_kb / 1024) + " " + T("units")[2] : "?"}` : null)}</dl>`, r1)}
      ${gpus}
      ${specCard("spec-board", "var(--muted)", T("board"), `<div class="name">${esc(((b.maker || "") + " " + (b.model || "")).trim() || T("unknown"))}</div>
        <dl>${row("bios_ver", b.bios)}${row("bios_date", b.bios_date)}
            ${row("ram_slots", ram.slots ? `${ram.slots_used ?? "?"} / ${ram.slots}` : null)}
            ${row("ram_max", ram.max_gb ? ram.max_gb + GBu : null)}</dl>`, r1)}
      ${specCard("spec-ram", "var(--ram)", T("ram"), `<div class="name">${dec(ram.total_gb, ram.total_gb % 1 ? 1 : 0)}${GBu}${ram.type ? " " + ram.type : ""}${ram.form ? " · " + esc(T(ram.form)) : ""}${ram.configured ? " · " + ram.configured + " MT/s" : ""}</div>
        ${ramRows.length ? `<table><tr>${th("th_slot")}${th("th_size")}${th("th_speed")}${th("th_maker")}${th("th_part")}</tr>${ramRows.join("")}</table>` : ""}`, "w6")}
      ${specCard("spec-disks", "var(--disk)", T("sec_disks"), `<table><tr>${th("th_disk")}${th("th_letters")}${th("th_model")}${th("th_type")}${th("th_size")}${th("th_health")}</tr>${disks}</table>`, "w6")}
      ${specCard("spec-os", "var(--muted)", T("system"), `<dl>${row("windows", os.name)}${row("version", os.build ? `${os.version} (${T("build")} ${os.build})` : os.version)}
            ${row("arch", os.arch)}${row("pcname", os.pc_name)}</dl>`, "w6")}
      ${specCard("spec-manual", "var(--warn)", T("manual_t"), manualForm(), "w6 tall")}
      ${specCard("spec-net", "var(--net)", T("netscreens"), `<dl>${(s.net || []).map(n => rowRaw(n.conn || T("netcard"), n.name + (n.speed_mbps ? ` (${fmtLink(n.speed_mbps)})` : ""))).join("")}
            ${(s.monitors || []).map((m, i) => rowRaw(T("screen") + " " + (i + 1), m)).join("")}</dl>`, "w6")}
    </div>`;
  applyCollapsed(el);
  const specsBox = el.querySelector(".specs");
  [...specsBox.children].forEach((n, i) => n.dataset.def = i);   // ordre par défaut = ordre d'affichage
  applyOrder(specsBox);
  document.getElementById("copy").onclick = copySummary;
  el.querySelectorAll("[data-mk]").forEach(inp => inp.addEventListener("change", () => {
    const v = inp.value.trim();
    if (v) manual[inp.dataset.mk] = v; else delete manual[inp.dataset.mk];
    saveSettings();
  }));

}

function manualForm() {

function summaryText() {
  const s = specs, r = s.ram, L = [], GBu = " " + T("units")[3];
  L.push(`${T("s_cpu")} : ${s.cpu.name}${s.cpu.cores ? ` (${s.cpu.cores} ${T("s_cores")} / ${s.cpu.threads} ${T("threads")})` : ""}`);
  L.push(`${T("s_board")} : ${`${s.board.maker} ${s.board.model}`.trim()}${s.board.bios ? ` (BIOS ${s.board.bios})` : ""}`);
  const mods = (r.modules || []).map(m => m.size_gb + GBu).join(" + ");
  L.push(`${T("s_ram")} : ${r.total_gb}${GBu} ${r.type || ""}${r.configured ? " " + r.configured + " MT/s" : ""}${mods ? " (" + mods + ")" : ""}${r.slots ? `, ${r.slots_used}/${r.slots} ${T("s_slots")}` : ""}`);
  (s.gpus || []).forEach(g => L.push(`${T("s_gpu")} : ${g.name}${g.vram_gb ? ` (${g.vram_gb}${GBu})` : ""}`));
  (s.disks || []).forEach(d => L.push(`${T("s_disk")} : ${d.name} – ${d.media} ${d.bus !== "?" ? d.bus : ""} ${sizeTxt(d.size_gb)}`.replace(/\s+/g, " ")));
  const M = manual, cert = M.psu_cert ? (M.psu_cert === "none" ? "" : " 80+ " + M.psu_cert[0].toUpperCase() + M.psu_cert.slice(1)) : "";
  if (M.psu_brand || M.psu_model || M.psu_watt)
    L.push(`${T("s_psu")} : ${[M.psu_brand, M.psu_model].filter(Boolean).join(" ")}${M.psu_watt ? " " + M.psu_watt + " W" : ""}${cert}`);
  if (M.case_model || M.case_gpu_mm)
    L.push(`${T("s_case")} : ${[M.case_model, M.case_form ? T("form_" + M.case_form) : "", M.case_gpu_mm ? "GPU max " + M.case_gpu_mm + " mm" : ""].filter(Boolean).join(", ")}`);
  if (M.cool_type || M.cool_model)
    L.push(`${T("s_cool")} : ${[M.cool_type ? T("cool_" + M.cool_type) : "", M.cool_model].filter(Boolean).join(" – ")}`);
  L.push(`${T("s_os")} : ${s.os.name}${s.os.build ? ` (${T("build")} ${s.os.build})` : ""}`);
  return L.join("\n");
}
function toast(msg) {
  const t = document.getElementById("toast"); t.textContent = msg;
  t.classList.add("on"); setTimeout(() => t.classList.remove("on"), 1800);
}
async function copySummary() {
  const text = summaryText();
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta);
    ta.select(); document.execCommand("copy"); ta.remove();
  }
  toast(T("copied"));
}

let detDisk = null, healthBusy = false;
async function loadHealth(refresh, admin) {
  const box = document.getElementById("d-extra"), disk = detDisk;
  healthBusy = true;
  if (refresh || admin) {
    box.querySelectorAll("button").forEach(b => b.disabled = true);
    const h5 = box.querySelector("h5");
    if (h5 && !h5.querySelector(".spinner")) h5.insertAdjacentHTML("beforeend", `<span class="spinner" style="width:14px;height:14px;margin:0;border-width:2px"></span>`);
  }
  if (admin) setText(box.querySelector(".h-msg"), T("h_wait_admin"));
  try {
    const h = await stJ(`/api/health?refresh=${refresh ? 1 : 0}&admin=${admin ? 1 : 0}`);
    if (detDisk === disk) renderHealth(h);
  } catch (e) {}
  healthBusy = false;
}
function healthVerdict(d) {
  const isHdd = d.media === 3, unc = (d.rUnc || 0) + (d.wUnc || 0);
  if (d.health === 2 || unc > 0) return ["verdict-bad", T("h_bad")];
  if (d.health === 1 || (!isHdd && d.wear != null && d.wear >= 80)) return ["verdict-warn", T("h_warn")];
  if (d.temp && d.temp >= (isHdd ? 55 : 70)) return ["verdict-warn", T("h_hot")];
  return ["verdict-ok", T("h_ok")];
}
function healthRows(d) {
  const isHdd = d.media === 3;
  const unc = (d.rUnc || 0) + (d.wUnc || 0);
  const v = healthVerdict(d);
  const st = {0: [T("health0"), "var(--ok)"], 1: [T("health1"), "var(--warn)"], 2: [T("health2"), "var(--bad)"]}[d.health] || ["?", "var(--muted)"];

  return TC[v >= 85 ? 2 : v >= 75 ? 1 : 0]; };

}

  if (drv && drv.scanned) {
    stSum = await stJ("/api/storage/summary?root=" + encodeURIComponent(stRoot));
    await stGo(stPath = []);
  } else stRender();
}
async function stGo(path) {
  stPath = path;
  stNode = await stJ(`/api/storage/node?root=${encodeURIComponent(stRoot)}&path=${encodeURIComponent(JSON.stringify(path))}`);
  stRender();
}
// santé d'un lecteur (C:, D:…) : on retrouve son disque physique via la fiche Composants
function stDiskOf(root) {
  const L = root.replace(/[:\\/]+$/, "").toUpperCase();
  return ((specs && specs.disks) || []).find(d => (d.letters || []).some(x => x.toUpperCase() === L));
}
function stDriveHealth(root) {
  const disk = stDiskOf(root), x = disk && stHealth && (stHealth.disks || {})[String(disk.id)];
  if (!x) return "";
  const v = healthVerdict(x), isHdd = x.media === 3;
  const st = {0: [T("health0"), "var(--ok)"], 1: [T("health1"), "var(--warn)"], 2: [T("health2"), "var(--bad)"]}[x.health] || ["?", "var(--muted)"];
  const bits = [x.temp ? x.temp + " °C" : null, !isHdd && x.wear != null ? (100 - x.wear) + " % " + T("h_life_s") : null,
                x.hours != null ? x.hours.toLocaleString(lang) + " h" : null].filter(Boolean);
  return `<small data-tip="${esc(v[1])}"><span style="color:${st[1]}">● ${esc(st[0])}</span>${bits.length ? " · " + esc(bits.join(" · ")) : ""}</small>`;
}
function stHealthBtn() {
  const any = stHealth && Object.keys(stHealth.disks || {}).length;
  const date = any && stHealth.date ? new Date(stHealth.date * 1000).toLocaleString(lang === "fr" ? "fr-FR" : "en-GB", {dateStyle: "short", timeStyle: "short"}) : "";
  const tip = stHealthBusy ? T("h_wait_admin") : date ? T("h_title_all") + " : " + T("h_read").toLowerCase() + " " + date : T("h_need_admin");
  return `<button class="btn sm" id="st-hread" ${stHealthBusy ? "disabled" : ""} data-tip="${esc(tip)}">${stHealthBusy ? `<span class="spinner" style="width:12px;height:12px;margin:0 6px 0 0;border-width:2px;display:inline-block;vertical-align:-2px"></span>` : ""}${esc(T(any ? "h_reread" : "h_admin"))}</button>`;
}
async function stScan() {
  await stJ("/api/storage/scan?root=" + encodeURIComponent(stRoot));
  stStatus = {running: true, root: stRoot, files: 0, bytes: 0, started: Date.now() / 1000};
  stRender(); stPoll();
}
function stPoll() {
  clearTimeout(stTimer);
  stTimer = setTimeout(async () => {
    stStatus = await stJ("/api/storage/status");
    if (stStatus.running) { stRenderProgress(); stPoll(); }
    else { const d = await stJ("/api/storage/drives"); stDrives = d.drives || []; await stLoad(); }
  }, 700);
}
const fmtDur = s => s >= 60 ? Math.floor(s / 60) + " min " + String(Math.floor(s % 60)).padStart(2, "0") + " s" : Math.max(1, Math.round(s)) + " s";
const openBtn = p => `<button class="detbtn" data-open="${esc(p)}" data-tip="${esc(T("st_open"))}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></button>`;
function stRenderProgress() {
  const el = document.getElementById("st-prog"); if (!el) return stRender();
  const s = stStatus;
  setHTML(el, `<div><b style="color:var(--text)">${(s.files || 0).toLocaleString(lang)}</b> ${esc(T("st_files"))} · <b style="color:var(--text)">${fmtBytes(s.bytes || 0, 1)}</b>
    · ${fmtDur(Date.now() / 1000 - (s.started || Date.now() / 1000))} ${esc(T("st_elapsed"))}</div><div class="p">${esc(s.path || "")}</div>`);
}
function stRender() {
  const el = document.getElementById("st-body");
  const running = stStatus.running && stStatus.root === stRoot;
  const hOf = root => { const k = stDiskOf(root); return k && stHealth && (stHealth.disks || {})[String(k.id)]; };
  const hCol = x => ({"verdict-ok": "var(--ok)", "verdict-warn": "var(--warn)", "verdict-bad": "var(--bad)"})[healthVerdict(x)[0]];
  const drives = stDrives.map(d => { const x = hOf(d.root);
    return `<button class="st-drive ${d.root === stRoot ? "on" : ""}" data-root="${esc(d.root)}">
      <div class="top"><b>${esc(d.root.replace(/\\$/, ""))}</b><small>${esc(d.fs)}</small><span style="flex:1"></span>
        ${x ? `<span class="hd" style="background:${hCol(x)}" data-tip="${esc(T("h_title") + " : " + healthVerdict(x)[1])}"></span>` : ""}</div>
      <div class="bar"><i style="width:${(d.used / d.total * 100).toFixed(1)}%;background:var(--disk)"></i></div>
      <small>${fmtBytes(d.total - d.used)} ${esc(T("free"))} / ${fmtBytes(d.total)}</small></button>`; }).join("");
  const tmpBtn = `<button class="st-drive ${stRoot === "__temp" ? "on" : ""}" data-root="__temp"><div class="top"><b>🧹 ${esc(T("tmp_t"))}</b></div>
      <small>${stTmp && stTmp.date ? fmtBytes(stTmp.total, 1) : "–"}</small></button>`;
  const drv = stDrives.find(x => x.root === stRoot);
  const L = (stRoot || "").replace(/\\$/, "");
  const hx = hOf(stRoot || "");
  let acts = stHealthBtn();
  if (running) acts += `<button class="btn sm" id="st-stop">${esc(T("st_stop"))}</button>`;
  else if (drv) acts += `<button class="btn sm" id="st-go">${esc(T(drv.scanned ? "st_rescan" : "st_scan").replace("{d}", L))}</button>`;
  const scanned = drv && drv.scanned ? esc(T("st_scanned")) + " " + new Date(drv.scanned * 1000).toLocaleString(lang === "fr" ? "fr-FR" : "en-GB", {dateStyle: "short", timeStyle: "short"}) : esc(T("st_never"));
  const msg = running ? "" : stStatus.stopped && stStatus.root === stRoot ? T("st_stopped") : stStatus.error ? T("st_err") : drv && !drv.scanned ? T("st_pick") : "";
  const head = drv ? `<div class="card st-head"><div class="st-bar"><span class="big">${esc(L)}</span>
      <div class="st-use"><div class="bar"><i style="width:${(drv.used / drv.total * 100).toFixed(1)}%;background:var(--disk)"></i></div>
        <span>${fmtBytes(drv.used)} / ${fmtBytes(drv.total)} · ${scanned}</span></div>
      <span style="flex:1"></span>${acts}</div>
      ${running ? `<div class="st-bar"><div class="spinner" style="width:16px;height:16px;margin:0;border-width:2px"></div><div class="st-prog" id="st-prog"></div></div>` : ""}
      ${msg ? `<div class="muted" style="font-size:12.5px">${esc(msg)}</div>` : ""}
      ${hx ? `<div class="st-health">${healthRows(hx).replace(/<dt([^>]*)>(.*?)<\/dt><dd>(.*?)<\/dd>/g, "<div$1><small>$2</small><b>$3</b></div>")}<span class="${healthVerdict(hx)[0]}">${esc(healthVerdict(hx)[1])}</span></div>` : ""}</div>` : "";
  let main = "";
  if (stSum && stNode && stNode.children && !running) {
    const N = stNode, tot = Math.max(1, N.size);
    const crumbs = [`<button data-crumb="-1">${esc(stRoot.replace(/\\$/, ""))}</button>`]
      .concat(stPath.map((p, i) => `<span>›</span><button data-crumb="${i}">${esc(p)}</button>`)).join("");
    const row = (name, size, files, dir, open, cls, full) => `<div class="st-row ${dir && open ? "dir" : ""}" ${dir && open ? `data-dir="${esc(name)}"` : ""} ${dir && !open ? `data-tip="${esc(T("st_small"))}"` : ""}>
        <div class="n ${cls || ""}">${dir ? "📁 " : ""}${esc(name)}</div>
        <div class="bar"><i style="width:${(size / tot * 100).toFixed(1)}%;background:var(--disk)"></i></div>
        <div class="r">${fmtBytes(size, size >= 1073741824 ? 1 : 0)}</div><div class="r m">${Math.round(size / tot * 100)} %</div>
        <div class="r m">${files != null ? files.toLocaleString(lang) : ""}</div><div>${full ? openBtn(full) : ""}</div></div>`;
    const base = joinPath(stRoot, stPath);
    const rows = N.children.map(c => row(c.name, c.size, c.files, true, c.open, "", base.replace(/\\$/, "") + "\\" + c.name))
      .concat(N.direct > 0 ? [row(T("st_direct"), N.direct, null, false, false, "dim", null)] : [])
      .concat(N.more ? [row(`… ${N.more.count} ${T("st_more")}`, N.more.size, null, false, false, "dim", null)] : []);
    const cats = Object.entries(stSum.cats).filter(([, v]) => v.size > 0).sort((a, b) => b[1].size - a[1].size);
    const ctot = Math.max(1, cats.reduce((a, [, v]) => a + v.size, 0));
    const catsHTML = `<div class="catbar">${cats.map(([k, v]) => `<i style="width:${(v.size / ctot * 100).toFixed(2)}%;background:${CATCOL[k]}"></i>`).join("")}</div>` +
      cats.map(([k, v]) => `<div class="catrow ${stCat === k ? "on" : ""}" data-cat="${k}"><span class="dot" style="background:${CATCOL[k]}"></span>
        <span>${esc(T("cat_" + k))} <small class="muted">${v.count.toLocaleString(lang)}</small></span><b class="r" style="text-align:right">${fmtBytes(v.size, 1)}</b>
        <span class="muted" style="text-align:right">${Math.round(v.size / ctot * 100)} %</span></div>`).join("");
    const files = (stCat ? stSum.cats[stCat].top : stSum.big).slice(0, 50).map(([size, p]) => {
      const i = Math.max(p.lastIndexOf("\\"), p.lastIndexOf("/")); return `<div class="file"><div class="n" title="${esc(p)}">${esc(p.slice(i + 1))}<small>${esc(p.slice(0, i))}</small></div>
        <b style="text-align:right;font-variant-numeric:tabular-nums">${fmtBytes(size, 1)}</b>${openBtn(p)}</div>`; }).join("");
    const denied = Math.max(0, stSum.used - stSum.total);
    main = `<div class="st-grid">
      <div class="card w7 tall"><div class="crumbs">${crumbs}</div>
        <div class="st-row head"><div>${esc(T("st_name"))}</div><div></div><div class="r">${esc(T("st_size"))}</div><div class="r">${esc(T("st_share"))}</div><div class="r">${esc(T("st_nfiles"))}</div><div></div></div>
        <div class="st-list">${rows.join("")}</div>
        <div class="muted" style="font-size:12px">${esc(T("st_scanned"))} ${new Date(stSum.date * 1000).toLocaleString(lang === "fr" ? "fr-FR" : "en-GB")} · ${esc(T("st_info"))} ${fmtDur(stSum.duration)}${denied > 1073741824 ? ` · ${esc(T("st_denied"))} : ${fmtBytes(denied, 1)}` : ""}</div></div>
      <div class="card w5"><h2 style="margin:0;font-size:15px">${esc(T("st_types"))}</h2>${catsHTML}</div>
      <div class="card w5 st-big"><div style="display:flex;align-items:center;gap:8px"><h2 style="margin:0;font-size:15px;flex:1">${esc(stCat ? T("cat_" + stCat) : T("st_big"))}</h2>
        ${stCat ? `<button class="btn sm" id="st-allcat">${esc(T("st_back"))}</button>` : ""}</div><div class="st-list" style="max-height:420px">${files}</div></div>
    </div>`;
  }
  el.innerHTML = `<div class="st-wrap"><div class="st-drives">${drives}${tmpBtn}</div><div class="st-main">${stRoot === "__temp" ? stTmpView() : head + main}</div></div>`;
  el.querySelectorAll("[data-tmp]").forEach(r => r.onclick = () => { const id = r.dataset.tmp; stTmpOpen.has(id) ? stTmpOpen.delete(id) : stTmpOpen.add(id); stRender(); });
  el.querySelectorAll("[data-ofold]").forEach(b => b.onclick = e => { e.stopPropagation(); fetch("/api/storage/openfolder?path=" + encodeURIComponent(b.dataset.ofold)); });
  const tr = document.getElementById("tmp-ref"); if (tr) tr.onclick = () => stTmpLoad(true);
  const tw = document.getElementById("tmp-win"); if (tw) tw.onclick = () => fetch("/api/storage/openfolder?path=ms-settings%3Astoragesense");
  const hb = document.getElementById("st-hread");
  if (hb) hb.onclick = async () => {
    stHealthBusy = true; stRender();
    try { stHealth = await stJ("/api/health?admin=1"); } catch (e) {}
    stHealthBusy = false; stRender();
  };
  if (running) stRenderProgress();
  el.querySelectorAll("[data-root]").forEach(b => b.onclick = () => { if (stRoot !== b.dataset.root) { stRoot = b.dataset.root; stCat = null; stLoad(); } });
  const go = document.getElementById("st-go"); if (go) go.onclick = stScan;
  const stop = document.getElementById("st-stop"); if (stop) stop.onclick = () => fetch("/api/storage/stop");
  const all = document.getElementById("st-allcat"); if (all) all.onclick = () => { stCat = null; stRender(); };
  el.querySelectorAll("[data-dir]").forEach(r => r.onclick = e => { if (!e.target.closest("[data-open]")) stGo(stPath.concat(r.dataset.dir)); });
  el.querySelectorAll("[data-crumb]").forEach(b => b.onclick = () => stGo(stPath.slice(0, +b.dataset.crumb + 1)));
  el.querySelectorAll("[data-cat]").forEach(r => r.onclick = () => { stCat = stCat === r.dataset.cat ? null : r.dataset.cat; stRender(); });
  el.querySelectorAll("[data-open]").forEach(b => b.onclick = e => { e.stopPropagation(); fetch("/api/storage/open?path=" + encodeURIComponent(b.dataset.open)); });
}

// =================== Langue & onglets ===================
function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i]").forEach(n => n.textContent = T(n.dataset.i));
  document.querySelectorAll("[data-ti]").forEach(n => n.title = T(n.dataset.ti));
  document.querySelectorAll(".section-title").forEach(s => s.dataset.tip = T("tip_sec"));
  document.querySelectorAll(".section-title .grip").forEach(s => s.dataset.tip = T("drag"));
  document.querySelectorAll("[data-tipk]").forEach(n => n.dataset.tip = T("tip_" + n.dataset.tipk));
  applyBig();
  for (const id of Object.keys(cards)) { cards[id].el.remove(); delete cards[id]; }
  redrawAll(); renderSpecs(); renderCustom();
  if (document.getElementById("storage").classList.contains("on")) stRender();
  if (document.getElementById("gaming").classList.contains("on")) { renderGames(); renderLib(); }
  const hEl = document.getElementById("an-hist"); if (hEl) { hEl.innerHTML = ""; renderHistory(); }
  if (detKind) openDetails(detKind + (detGpu ? ":" + detGpu : ""), document.querySelector(`.card[data-id="${CSS.escape(detCard?.dataset.id || "")}"]`));
}
// =================== Mises à jour (seulement sur demande) ===================
let upState = null;
const upPop = document.getElementById("up-pop");
function renderUp() {
  const S = upState || {};
  let body = "";
  if (S.phase === "checking") body = `<div class="muted" style="display:flex;gap:8px;align-items:center"><span class="spinner" style="width:14px;height:14px;margin:0;border-width:2px"></span>${esc(T("up_checking"))}</div>`;
  else if (S.phase === "installing") body = `<div style="display:flex;gap:8px;align-items:center"><span class="spinner" style="width:14px;height:14px;margin:0;border-width:2px"></span>${esc(T(S.done ? "up_restart" : "up_installing"))}</div>`;
  else if (S.error) body = `<div style="color:var(--warn)">${esc(T({norepo: "up_norepo", net: "up_net", norelease: "up_norel", rate: "up_rate"}[S.error] || "up_err"))}</div>`;
  else if (S.newer) body = `<div><b style="color:var(--ok)">${esc(T("up_avail"))} v${esc(S.latest)}</b></div>${S.notes ? `<div class="notes">${esc(S.notes)}</div>` : ""}
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" id="up-inst">${esc(T("up_install"))}</button></div>
      <div class="muted" style="font-size:12px">${esc(T("up_inst_note"))}</div>`;
  else if (S.latest) body = `<div style="color:var(--ok)">✓ ${esc(T("up_ok"))}</div>`;
  setHTML(upPop, `<h4 style="margin:0">${esc(T("up_t"))}</h4><div>${esc(T("up_cur"))} <b>v{{VERSION}}</b></div>${body}
    ${S.phase ? "" : `<div><button class="btn sm" id="up-check">${esc(T("up_check"))}</button></div>`}
    <div class="muted" style="font-size:12px">${esc(T("up_privacy"))}</div>`);
  const c = document.getElementById("up-check"); if (c) c.onclick = upCheck;
  const i = document.getElementById("up-inst"); if (i) i.onclick = upInstall;
}
async function upCheck() {
  upState = {phase: "checking"}; renderUp();
  try { upState = await stJ("/api/update/check"); } catch (e) { upState = {error: "net"}; }
  renderUp();
}
async function upInstall() {
  const keep = upState; upState = {phase: "installing"}; renderUp();
  try { await stJ("/api/update/install"); } catch (e) {}
  const poll = async () => {
    let st = null; try { st = await stJ("/api/update/status"); } catch (e) { upState = {phase: "installing", done: true}; renderUp(); return; }
    if (st.error) { upState = {...keep, error: "err"}; renderUp(); return; }
    upState = {phase: "installing", done: st.done}; renderUp();
    setTimeout(poll, 1000);
  };
  setTimeout(poll, 800);
}
document.getElementById("ver-btn").onclick = e => { e.stopPropagation(); upPop.classList.toggle("on"); if (upPop.classList.contains("on")) renderUp(); };
upPop.addEventListener("click", e => e.stopPropagation());
document.addEventListener("click", () => upPop.classList.remove("on"));
function privacyHTML() {
  const li = k => `<ul>${T(k).map(x => `<li>${x}</li>`).join("")}</ul>`;   // textes fixes de l'appli (pas de données externes)
  const badge = (k, icon) => `<div class="pv-badge"><span>${icon}</span>${esc(T(k))}</div>`;
  return `<div class="card prv" id="privacy"><h2>🛡 ${esc(T("tab_privacy"))} · ${esc(T("pv_t"))}</h2><p>${esc(T("pv_intro"))}</p>
    <div class="pv-badges">${badge("pv_b1", "🌐")}${badge("pv_b2", "🚫")}${badge("pv_b3", "👤")}${badge("pv_b4", "🗑")}</div>
    <div class="prv-cols"><div><h3>${esc(T("pv_read_t"))}</h3>${li("pv_read")}<h3>${esc(T("pv_net_t"))}</h3>${li("pv_net")}</div>
      <div><h3>${esc(T("pv_store_t"))}</h3>${li("pv_store")}<p class="muted">${esc(T("pv_store_note"))}</p>
        <div><button class="btn sm" id="pv-open">${esc(T("pv_open"))}</button></div>
        <h3>${esc(T("pv_never_t"))}</h3>${li("pv_never")}</div></div></div>`;
}
document.getElementById("pv-btn").onclick = e => {      // icône à côté de la version : va à la section Vie privée des Paramètres
  e.stopPropagation();
  document.querySelector('#tabs button[data-tab="custom"]').click();
  setTimeout(() => { const p = document.getElementById("privacy"); if (!p) return;
    p.scrollIntoView({behavior: "smooth", block: "start"}); p.classList.remove("flash"); p.offsetWidth; p.classList.add("flash"); }, 350);
};
new ResizeObserver(() => document.documentElement.style.setProperty("--hdr-h", document.querySelector("header").offsetHeight + "px"))
  .observe(document.querySelector("header"));
function moveTabInd(anim = true) {
  const b = document.querySelector("#tabs button.on"), ind = document.getElementById("tab-ind"); if (!b || !ind) return;
  if (!anim) ind.style.transition = "none";
  ind.style.left = b.offsetLeft + "px"; ind.style.width = b.offsetWidth + "px";
  if (!anim) { ind.offsetWidth; ind.style.transition = ""; }
}
new ResizeObserver(() => moveTabInd(false)).observe(document.getElementById("tabs"));
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("on", x === b));
  moveTabInd();
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.id === b.dataset.tab));
  if (b.dataset.tab === "perf") redrawAll();
  if (b.dataset.tab === "storage") stOpen();
  if (b.dataset.tab === "analysis") renderAnalysis(true);
  if (b.dataset.tab === "gaming") { loadGames(); glApps = []; loadLib(); stJ("/api/games/apps").then(a => { glApps = a.apps || []; renderLib(); }).catch(() => {}); }
  if (b.dataset.tab === "custom") fetch("/api/settings", {cache: "no-store"}).then(r => r.json()).then(st => {
    widgetOn = !!st.widget; widgetStyle = st.widget_style === "bars" ? "bars" : "compact"; autostart = !!st.autostart; renderCustom();
  }).catch(() => {});
});
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { redrawAll(); drawHistory(); }, 150); });

// Boucle : 1 s quand la fenêtre est visible, 20 s quand elle est réduite (l'appli se met en veille).
let timer = null;
function schedule() {
  clearTimeout(timer);
  timer = setTimeout(async () => { await tick(); schedule(); }, document.hidden ? 20000 : 1000);
}
// Fenêtre réduite : après 3 s, on demande à Windows de reprendre la RAM inutilisée.
let trimTimer = null;
document.addEventListener("visibilitychange", () => {
  clearTimeout(trimTimer);
  if (document.hidden) trimTimer = setTimeout(() => fetch("/api/trim", {cache: "no-store"}).catch(() => {}), 3000);
  else tick();
  schedule();
});

(async () => {
  await loadSettings();
  document.documentElement.dataset.theme = theme;
  readColors();
  applyBig();
  applyOrder(sectionsEl);
  applyCollapsed();
  applyLang();
  await tick();
  schedule();
})();
</script>
</body>
